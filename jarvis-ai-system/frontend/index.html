<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Chat Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1e3f 50%, #0d1117 100%);
            color: #00d4ff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #00d4ff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .header h1 {
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14;
            letter-spacing: 2px;
        }

        .status-bar {
            background: rgba(0, 212, 255, 0.1);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00d4ff;
        }

        .status-item {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            background: rgba(57, 255, 20, 0.2);
            color: #39ff14;
            border: 1px solid #39ff14;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            border: 1px solid;
        }

        .message.user .message-bubble {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
            color: #00d4ff;
        }

        .message.ai .message-bubble {
            background: rgba(57, 255, 20, 0.2);
            border-color: #39ff14;
            color: #39ff14;
        }

        .message-time {
            font-size: 10px;
            color: #7dd3fc;
            align-self: flex-end;
        }

        .input-area {
            background: rgba(0, 0, 0, 0.5);
            border-top: 2px solid #00d4ff;
            padding: 20px;
            display: flex;
            gap: 10px;
            box-shadow: inset 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            background: rgba(0, 212, 255, 0.05);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            color: #39ff14;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 15px #00d4ff;
        }

        input::placeholder {
            color: #7dd3fc;
        }

        button {
            padding: 12px 20px;
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            color: #00d4ff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            font-size: 11px;
        }

        button:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 15px #00d4ff;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .clear-btn {
            background: rgba(255, 68, 68, 0.2);
            border-color: #ff4444;
            color: #ff4444;
        }

        .clear-btn:hover {
            background: rgba(255, 68, 68, 0.3);
            box-shadow: 0 0 15px #ff4444;
        }

        .loading {
            display: flex;
            gap: 5px;
            justify-content: center;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #39ff14;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        .scroll-bottom {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 JARVIS Chat Interface</h1>
        <p style="color: #7dd3fc; font-size: 12px; margin-top: 5px;">Iron Man Style AI Communication</p>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span>Status:</span>
            <span class="status-badge" id="statusBadge">● ONLINE</span>
        </div>
        <div class="status-item">
            <span>Messages:</span>
            <span id="messageCount">0</span>
        </div>
        <div class="status-item">
            <span>Confidence:</span>
            <span id="confidence">0%</span>
        </div>
    </div>

    <div class="chat-container scroll-bottom" id="chatContainer"></div>

    <div class="input-area">
        <div class="input-wrapper">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Type your message... (or ask anything)"
            >
            <button id="sendBtn">Send</button>
            <button class="clear-btn" id="clearBtn">Clear</button>
        </div>
    </div>

    <script>
        // ============ CONFIGURATION ============
        const API_BASE = 'http://localhost:5000/api';
        const UPDATE_INTERVAL = 2000;

        // ============ STATE ============
        let messages = [];
        let messageCount = 0;

        // ============ DOM ELEMENTS ============
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusBadge = document.getElementById('statusBadge');
        const messageCountDisplay = document.getElementById('messageCount');
        const confidenceDisplay = document.getElementById('confidence');

        // ============ FUNCTIONS ============
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Add user message
            addMessage(text, 'user');
            messageInput.value = '';
            messageCount++;
            messageCountDisplay.textContent = messageCount;

            // Show loading
            addLoadingMessage();

            try {
                // Send to API
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) throw new Error('API Error');

                const data = await response.json();

                // Remove loading
                removeLoadingMessage();

                // Add AI response
                addMessage(data.ai_response, 'ai');
                confidenceDisplay.textContent = Math.round(data.confidence) + '%';
                messageCount++;
                messageCountDisplay.textContent = messageCount;

            } catch (error) {
                removeLoadingMessage();
                addMessage('❌ Error: Could not connect to server', 'ai');
                console.error(error);
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString();

            messageDiv.appendChild(bubble);
            messageDiv.appendChild(time);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            messages.push({ text, sender, time: new Date() });
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'loading-message';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.innerHTML = '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingMessage() {
            const loading = document.getElementById('loading-message');
            if (loading) loading.remove();
        }

        function clearChat() {
            if (confirm('Clear all messages?')) {
                chatContainer.innerHTML = '';
                messages = [];
                messageCount = 0;
                messageCountDisplay.textContent = '0';
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                if (!response.ok) {
                    statusBadge.textContent = '● OFFLINE';
                    statusBadge.style.background = 'rgba(255, 68, 68, 0.2)';
                    statusBadge.style.borderColor = '#ff4444';
                    statusBadge.style.color = '#ff4444';
                    return;
                }

                const data = await response.json();
                statusBadge.textContent = `● ${data.status.toUpperCase()}`;
                
                if (data.status === 'online') {
                    statusBadge.style.background = 'rgba(57, 255, 20, 0.2)';
                    statusBadge.style.borderColor = '#39ff14';
                    statusBadge.style.color = '#39ff14';
                }
            } catch (error) {
                statusBadge.textContent = '● OFFLINE';
                console.error('Status update error:', error);
            }
        }

        // ============ EVENT LISTENERS ============
        sendBtn.addEventListener('click', sendMessage);
        clearBtn.addEventListener('click', clearChat);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ============ INITIALIZATION ============
        window.addEventListener('load', () => {
            updateStatus();
            setInterval(updateStatus, UPDATE_INTERVAL);
            messageInput.focus();
            addMessage('👋 Welcome to JARVIS AI System', 'ai');
            addMessage('Type your message and press Enter or click Send', 'ai');
            messageCount = 2;
            messageCountDisplay.textContent = messageCount;
        });
    </script>
</body>
</html>
